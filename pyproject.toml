[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos_padatious"
dynamic = ["version"]
description = "A neural network intent parser"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Scholefield" }]
keywords = ["intent-parser", "parser", "text", "text-processing", "nlp", "ovos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20,<3.0.0",
    "xxhash",
    # opm.pipeline entrypoint + the bus-client 2.x test stack need opm 2.x;
    # the stable opm releases all cap ovos-bus-client<2.0.0, so pin the
    # prerelease floor to let pip resolve .[test] without --pre.
    "ovos-plugin-manager>=2.3.0a1,<3.0.0",
    "ovos-utils>=0.7.0,<1.0.0",
    "ovos-spec-tools>=1.5.0a1",
    "langcodes",
    "snowballstemmer",
    "PyStemmer",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    # INTENT-4 consumer e2e stack floor. Mirrors ovos-test-harness@dev.
    "ovos-bus-client>=2.5.1a1,<3.0.0",
    "ovos-spec-tools>=1.5.0a1",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-padatious-pipeline-plugin"

[project.entry-points."opm.pipeline"]
"ovos-padatious-pipeline-plugin" = "ovos_padatious.opm:PadatiousPipeline"

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_padatious*"]

[tool.setuptools.dynamic]
version = { attr = "ovos_padatious.version.__version__" }
